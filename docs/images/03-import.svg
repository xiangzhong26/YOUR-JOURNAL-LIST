<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="640" rx="0" fill="#f3f6f2" stroke="#f3f6f2"/><text x="38" y="39" font-size="15" fill="#226b54" font-weight="700">YOUR JOURNAL LIST  /  操作示意 · ILLUSTRATED GUIDE</text><text x="38" y="87" font-size="30" fill="#213b35" font-weight="700">预览、检查、启用 / Preview, review &amp; enable</text><text x="38" y="119" font-size="18" fill="#63736c" font-weight="400">未确认的多义名称显示“待确认”。 / Ambiguous names are flagged for review.</text><rect x="38" y="155" width="720" height="406" rx="14" fill="#ffffff" stroke="#d9e3dc"/><text x="62" y="191" font-size="23" fill="#213b35" font-weight="700">学院目录 / Catalog manager</text><rect x="505" y="166" width="230" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="519" y="195" font-size="17" fill="#ffffff" font-weight="600">导入 JSON / CSV</text><text x="62" y="235" font-size="21" fill="#213b35" font-weight="600">确认导入 / Import preview</text><rect x="62" y="252" width="672" height="60" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="78" y="289" font-size="19" fill="#213b35" font-weight="400">演示管理学院 · 2026-demo · 4 records</text><text x="78" y="342" font-size="17" fill="#63736c" font-weight="400">标准刊名 / Journal</text><text x="553" y="342" font-size="17" fill="#63736c" font-weight="400">等级 / Grade</text><text x="78" y="380" font-size="21" fill="#213b35" font-weight="400">R&amp;D Management</text><text x="553" y="380" font-size="21" fill="#226b54" font-weight="700">A类</text><text x="78" y="414" font-size="18" fill="#63736c" font-weight="400">别名 / Alias: RD Management</text><rect x="62" y="435" width="672" height="40" rx="6" fill="#fff3dc" stroke="#ead8aa"/><text x="76" y="462" font-size="18" fill="#805c1a" font-weight="400">Shared Review → 名称冲突 / Conflicting alias</text><rect x="62" y="494" width="220" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="76" y="523" font-size="17" fill="#ffffff" font-weight="600">确认并启用 / Enable</text><rect x="786" y="155" width="376" height="406" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="817" cy="191" r="17" fill="#dbeee1"/><text x="812" y="197" font-size="17" fill="#226b54" font-weight="700">1</text><text x="844" y="198" font-size="20" fill="#213b35" font-weight="600">选择 JSON 或 CSV</text><text x="808" y="232" font-size="18" fill="#63736c" font-weight="400">Choose your catalog file</text><circle cx="817" cy="280" r="17" fill="#dbeee1"/><text x="812" y="286" font-size="17" fill="#226b54" font-weight="700">2</text><text x="844" y="287" font-size="20" fill="#213b35" font-weight="600">检查元数据与冲突</text><text x="808" y="321" font-size="17" fill="#63736c" font-weight="400">Review metadata and warnings</text><circle cx="817" cy="369" r="17" fill="#dbeee1"/><text x="812" y="375" font-size="17" fill="#226b54" font-weight="700">3</text><text x="844" y="376" font-size="20" fill="#213b35" font-weight="600">新增或替换后启用</text><text x="808" y="410" font-size="17" fill="#63736c" font-weight="400">Add or replace, then enable</text><text x="808" y="464" font-size="17" fill="#213b35" font-weight="400">示例等级为虚构。</text><text x="808" y="493" font-size="17" fill="#63736c" font-weight="400">Demo grades are fictional.</text><text x="38" y="608" font-size="14" fill="#63736c" font-weight="400">示意图，非软件截图 / Illustration, not a screenshot. UI positions may vary by Zotero version.</text></g></svg>
