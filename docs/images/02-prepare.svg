<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="640" rx="0" fill="#f3f6f2" stroke="#f3f6f2"/><text x="38" y="39" font-size="15" fill="#226b54" font-weight="700">YOUR JOURNAL LIST  /  操作示意 · ILLUSTRATED GUIDE</text><text x="38" y="87" font-size="30" fill="#213b35" font-weight="700">把学院目录变成导入文件 / Prepare your catalog</text><text x="38" y="119" font-size="18" fill="#63736c" font-weight="400">AI 负责整理；期刊等级以官方材料为准。 / AI organizes the data; grades come from the official list.</text><rect x="38" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="67" cy="192" r="17" fill="#dbeee1"/><text x="62" y="198" font-size="17" fill="#226b54" font-weight="700">1</text><text x="94" y="199" font-size="21" fill="#213b35" font-weight="700">提供官方目录</text><text x="60" y="231" font-size="17" fill="#63736c" font-weight="400">Supply the official list</text><rect x="432" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="461" cy="192" r="17" fill="#dbeee1"/><text x="456" y="198" font-size="17" fill="#226b54" font-weight="700">2</text><text x="488" y="199" font-size="21" fill="#213b35" font-weight="700">复制整理提示词</text><text x="454" y="231" font-size="17" fill="#63736c" font-weight="400">Use a preparation prompt</text><rect x="826" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="855" cy="192" r="17" fill="#dbeee1"/><text x="850" y="198" font-size="17" fill="#226b54" font-weight="700">3</text><text x="882" y="199" font-size="21" fill="#213b35" font-weight="700">核对后保存</text><text x="848" y="231" font-size="17" fill="#63736c" font-weight="400">Review and save</text><rect x="64" y="273" width="286" height="121" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="82" y="309" font-size="17" fill="#213b35" font-weight="400">学院官方 PDF / Word / Excel</text><text x="82" y="343" font-size="19" fill="#213b35" font-weight="400">或图片、目录文本</text><text x="82" y="376" font-size="16" fill="#63736c" font-weight="400">Official source documents</text><text x="60" y="441" font-size="19" fill="#213b35" font-weight="400">上传给你使用的 AI</text><text x="60" y="476" font-size="16" fill="#63736c" font-weight="400">Attach to your AI conversation</text><rect x="454" y="278" width="294" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="468" y="307" font-size="17" fill="#ffffff" font-weight="600">复制 AI 整理提示词</text><rect x="454" y="339" width="294" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="468" y="368" font-size="17" fill="#ffffff" font-weight="600">Copy English prompt</text><text x="454" y="441" font-size="19" fill="#213b35" font-weight="400">发送提示词与目录材料</text><text x="454" y="476" font-size="16" fill="#63736c" font-weight="400">Send the prompt with your files</text><rect x="848" y="273" width="294" height="121" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="866" y="309" font-size="23" fill="#226b54" font-weight="700">journal-list.json</text><text x="866" y="343" font-size="17" fill="#213b35" font-weight="400">UTF-8 · 纯 JSON / Raw JSON</text><text x="866" y="376" font-size="16" fill="#63736c" font-weight="400">无说明文字 / No commentary</text><text x="848" y="441" font-size="19" fill="#213b35" font-weight="400">核对等级、别名与总数</text><text x="848" y="476" font-size="16" fill="#63736c" font-weight="400">Check grades, aliases &amp; counts</text><text x="38" y="608" font-size="14" fill="#63736c" font-weight="400">示意图，非软件截图 / Illustration, not a screenshot. UI positions may vary by Zotero version.</text></g></svg>
