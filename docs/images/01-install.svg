<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="640" rx="0" fill="#f3f6f2" stroke="#f3f6f2"/><text x="38" y="39" font-size="15" fill="#226b54" font-weight="700">YOUR JOURNAL LIST  /  操作示意 · ILLUSTRATED GUIDE</text><text x="38" y="87" font-size="30" fill="#213b35" font-weight="700">安装并找到入口 / Install &amp; open</text><text x="38" y="119" font-size="18" fill="#63736c" font-weight="400">从 Releases 下载 .xpi，安装后打开“学院等级”。 / Download, install, then open the plugin.</text><rect x="38" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="67" cy="192" r="17" fill="#dbeee1"/><text x="62" y="198" font-size="17" fill="#226b54" font-weight="700">1</text><text x="94" y="199" font-size="22" fill="#213b35" font-weight="700">下载插件</text><text x="60" y="231" font-size="17" fill="#63736c" font-weight="400">Download the XPI</text><rect x="432" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="461" cy="192" r="17" fill="#dbeee1"/><text x="456" y="198" font-size="17" fill="#226b54" font-weight="700">2</text><text x="488" y="199" font-size="22" fill="#213b35" font-weight="700">从文件安装</text><text x="454" y="231" font-size="17" fill="#63736c" font-weight="400">Install from a file</text><rect x="826" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="855" cy="192" r="17" fill="#dbeee1"/><text x="850" y="198" font-size="17" fill="#226b54" font-weight="700">3</text><text x="882" y="199" font-size="22" fill="#213b35" font-weight="700">打开插件</text><text x="848" y="231" font-size="17" fill="#63736c" font-weight="400">Open the manager</text><text x="60" y="282" font-size="20" fill="#213b35" font-weight="400">GitHub → Releases</text><rect x="60" y="305" width="294" height="102" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="76" y="340" font-size="20" fill="#213b35" font-weight="600">your-journal-list-</text><text x="76" y="371" font-size="22" fill="#226b54" font-weight="700">0.1.0.xpi</text><text x="60" y="449" font-size="19" fill="#213b35" font-weight="400">选择 .xpi 附件</text><text x="60" y="481" font-size="17" fill="#63736c" font-weight="400">Choose the .xpi asset</text><text x="454" y="282" font-size="17" fill="#213b35" font-weight="400">工具 / Tools → 插件 / Plugins</text><rect x="454" y="305" width="294" height="102" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="470" y="341" font-size="20" fill="#213b35" font-weight="400">齿轮 / Gear →</text><text x="470" y="375" font-size="18" fill="#213b35" font-weight="400">Install Plugin From File…</text><text x="454" y="449" font-size="19" fill="#213b35" font-weight="400">选择下载好的 .xpi</text><text x="454" y="481" font-size="17" fill="#63736c" font-weight="400">Select your downloaded XPI</text><text x="848" y="282" font-size="17" fill="#213b35" font-weight="400">文献列表工具栏 / Item toolbar</text><rect x="848" y="320" width="292" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="862" y="349" font-size="17" fill="#ffffff" font-weight="600">学院等级 · 导入目录</text><text x="848" y="409" font-size="18" fill="#213b35" font-weight="400">也可从“工具”菜单打开</text><text x="848" y="441" font-size="17" fill="#63736c" font-weight="400">Or use the Tools menu:</text><text x="848" y="475" font-size="16" fill="#213b35" font-weight="400">学院期刊目录 / Your Journal List</text><text x="38" y="608" font-size="14" fill="#63736c" font-weight="400">示意图，非软件截图 / Illustration, not a screenshot. UI positions may vary by Zotero version.</text></g></svg>
