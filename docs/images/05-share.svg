<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="640" rx="0" fill="#f3f6f2" stroke="#f3f6f2"/><text x="38" y="39" font-size="15" fill="#226b54" font-weight="700">YOUR JOURNAL LIST  /  操作示意 · ILLUSTRATED GUIDE</text><text x="38" y="87" font-size="30" fill="#213b35" font-weight="700">多目录管理 / Manage, share &amp; update</text><text x="38" y="119" font-size="18" fill="#63736c" font-weight="400">学院目录版本与插件版本相互独立。 / Catalog editions and plugin versions are separate.</text><rect x="38" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="67" cy="192" r="17" fill="#dbeee1"/><text x="62" y="198" font-size="17" fill="#226b54" font-weight="700">1</text><text x="94" y="199" font-size="21" fill="#213b35" font-weight="700">切换学院或版本</text><text x="60" y="231" font-size="17" fill="#63736c" font-weight="400">Switch catalogs</text><rect x="432" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="461" cy="192" r="17" fill="#dbeee1"/><text x="456" y="198" font-size="17" fill="#226b54" font-weight="700">2</text><text x="488" y="199" font-size="21" fill="#213b35" font-weight="700">导出并分享</text><text x="454" y="231" font-size="17" fill="#63736c" font-weight="400">Export and share</text><rect x="826" y="162" width="338" height="370" rx="14" fill="#ffffff" stroke="#d9e3dc"/><circle cx="855" cy="192" r="17" fill="#dbeee1"/><text x="850" y="198" font-size="17" fill="#226b54" font-weight="700">3</text><text x="882" y="199" font-size="21" fill="#213b35" font-weight="700">更新目录</text><text x="848" y="231" font-size="17" fill="#63736c" font-weight="400">Update a catalog</text><rect x="60" y="278" width="294" height="103" rx="14" fill="#eaf3ed" stroke="#d9e3dc"/><text x="76" y="314" font-size="20" fill="#226b54" font-weight="600">管理学院 · 2026版</text><text x="76" y="350" font-size="20" fill="#213b35" font-weight="400">经济学院 · 2025版</text><text x="60" y="430" font-size="17" fill="#213b35" font-weight="400">从“当前使用的目录”选择</text><text x="60" y="464" font-size="17" fill="#63736c" font-weight="400">Choose the active catalog</text><rect x="454" y="278" width="294" height="44" rx="7" fill="#226b54" stroke="#226b54"/><text x="468" y="307" font-size="17" fill="#ffffff" font-weight="600">导出 / Export</text><text x="454" y="365" font-size="23" fill="#226b54" font-weight="700">journal-list.json</text><text x="454" y="430" font-size="17" fill="#213b35" font-weight="400">另一台电脑或同学手动导入</text><text x="454" y="464" font-size="17" fill="#63736c" font-weight="400">Import on another computer</text><text x="848" y="291" font-size="22" fill="#213b35" font-weight="600">新增 / Add</text><text x="848" y="328" font-size="16" fill="#63736c" font-weight="400">保留旧版本 / Keep old edition</text><text x="848" y="389" font-size="22" fill="#213b35" font-weight="600">替换 / Replace</text><text x="848" y="426" font-size="16" fill="#63736c" font-weight="400">先导出备份 / Export a backup first</text><text x="848" y="482" font-size="17" fill="#213b35" font-weight="400">目录不随 Zotero 自动同步</text><text x="38" y="608" font-size="14" fill="#63736c" font-weight="400">示意图，非软件截图 / Illustration, not a screenshot. UI positions may vary by Zotero version.</text></g></svg>
